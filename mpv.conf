# ============================================================
# mpv.conf — 合并自 4 篇 Windows 配置笔记 + 实机适配
# 实机：RTX 4060 Laptop / mpv v0.41.0 (C:\Program Files\MPV Player)
# 配置目录：%APPDATA%\mpv
# ============================================================

# ===== 渲染与解码（Windows：d3d11 + auto-safe 硬解）=====
vo=gpu-next
gpu-api=d3d11
# 强制使用 NVIDIA RTX 4060（禁用 Intel 核显）
d3d11-adapter="NVIDIA GeForce RTX 4060 Laptop GPU"
hwdec=auto-copy-safe
hwdec-codecs=all

# ===== 音频（Windows 原生 wasapi）=====
ao=wasapi
audio-channels=auto-safe

# ===== 画质：高质量缩放（HQ 档）=====
scale=ewa_lanczossharp
cscale=catmull_rom
dscale=catmull_rom
scale-antiring=0.5
sigmoid-upscaling=yes
correct-downscaling=yes

# ===== 去色带（低强度档）=====
deband=yes
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=16

# ===== 内置轻量补帧（时间插值，无需 VapourSynth）=====
video-sync=display-resample
interpolation=yes
tscale=sphinx

# ===== HDR → SDR 色彩映射（SDR 屏看 HDR 源）=====
icc-profile-auto=yes
tone-mapping=hable
target-peak=100
dither-depth=auto

# ===== OSD / 字幕字体 =====
# 字幕自动加载
sub-codepage=auto
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles:字幕
slang=chs,sc,zh-Hans,zh-CN,cht,tc,zh-Hant,zh-HK,zh-TW,chi,zho,zh,eng,en,english,jpn,ja,jp,japanese
sub-fonts-dir="~~/fonts"
sub-font="LXGW WenKai Screen;Noto Color Emoji"
sub-font-size=34
sub-bold=no
sub-color="#CDD6F4"
sub-border-size=0.5
sub-outline-size=0.5
sub-outline-color="#11111B"
sub-shadow-offset=0.5
sub-back-color="#181825"
# 菜单/OSD 字体：华文行楷（用户指定：菜单界面用行楷）+ Noto 兜底
osd-font="STKaiti"
osd-font-size=30
osd-font-provider=auto

# ===== 网页视频（yt-dlp）=====
ytdl=yes
# 锁 4K 上限防 8K 高码率流损坏崩溃；排除 vp9.2（HDR 误选）
ytdl-format=bestvideo[vcodec~=av01][height<=?2160][vcodec!=?vp9.2]+bestaudio/bestvideo[vcodec!=?vp9.2][vcodec!=?vp9][height<=?2160]+bestaudio/best

# ===== B 站防盗链 Referer（缺它会 403 黑屏）=====
http-header-fields="Referer:https://www.bilibili.com"

# ===== CAS 锐化（轻量，默认开启，Ctrl+1 切换）=====
#glsl-shaders-append="~~/shaders/igv/adaptive-sharpen_luma.glsl"  # CAS default off, Ctrl+1 to toggle

# ===== 日志降噪（auto_profiles 的条件求值日志很吵）=====
msg-level=all=info,auto_profiles=warn,ffmpeg=error
# 崩溃诊断日志（出现异常时查看 %APPDATA%\mpv\files\mpv.log 最后几行）
log-file="~~/files/mpv.log"
# 播放列表为空时保持窗口不退出（重载失败/切编码失败时的最后防线）
idle=yes
# 禁用启动时自动恢复上次播放状态（避免恢复触发的二次解析失败链；退出仍会保存进度）
resume-playback=no

# ===== 右键菜单与界面：uosc（scripts/uosc/）=====
# 使用项目的中文增强 stats.lua，避免与 mpv 内置 stats.lua 重复加载
load-stats-overlay=no
# uosc 提供中文右键菜单（读取 input.conf 的 #menu: 注解）+ 进度条/控制按钮/音量条
# 内置 OSC 关闭，避免双重界面
input-default-bindings=no              # 禁用 mpv 内置默认键位，统一由 input.conf 管理
osc=no
# 内置英文 context menu 关闭（由 uosc 接管右键）
load-context-menu=no

# ============================================================
# 借鉴 emoeem/mpv 配置包的增强项（2026-08 整合）
# ============================================================

# ----- 播放记忆（退出记住进度；白名单避免恢复 vf 补帧状态）-----
save-position-on-quit=yes
watch-later-dir="~~/cache/watch_later"
watch-later-options=start,vid,aid,sid
window-affinity=monitor            # 窗口只在当前显示器内，不跨屏

# ----- 窗口置顶（暂停时自动取消，见 [pause]）-----
ontop

# ----- 画质微调 -----
dither=fruit
dither-size-fruit=6
dscale-antiring=0.5
audio-format=float
hr-seek=yes

# ----- 缓存加速 -----
gpu-shader-cache-dir="~~/cache/shaders_cache"
icc-cache-dir="~~/cache/icc_cache"

# ----- 高质量截图 -----
screenshot-format=webp
screenshot-webp-quality=95
screenshot-tag-colorspace=yes
screenshot-template="~~/files/screen/%f-%P-%n"

# ----- HDR 增强（外接显示器）-----
hdr-contrast-recovery=0.30
hdr-peak-percentile=99.995
hdr-peak-decay-rate=20
hdr-scene-threshold-low=1.0
hdr-scene-threshold-high=3.0
allow-delayed-peak-detect=yes

# ============================================================
# 条件配置组（借鉴 emoeem）
# ============================================================

# HDR 内容自动优化（PQ/HLG 源，SDR 片源不触发）
[HDR]
profile-cond=get("video-params/gamma", "") == "pq" or get("video-params/gamma", "") == "hlg"
profile-restore=copy
target-peak=auto
target-colorspace-hint=auto
target-colorspace-hint-mode=target
hdr-reference-white=203
deband=no
vf=""

# HDR 直通（仅 HDR 显示器生效，SDR 屏自动不触发）
[HDR-PASS]
profile-cond=(get("video-params/gamma", "") == "pq" or get("video-params/gamma", "") == "hlg") and get("video-target-params/max-luma", 0) > 203
profile-restore=copy
icc-profile=""
icc-profile-auto=no
target-colorspace-hint=auto
target-colorspace-hint-mode=target
inverse-tone-mapping=no
target-prim=auto
target-trc=auto
target-peak=auto
target-contrast=auto

# 高帧率源（>47fps）自动关闭补帧防掉帧
[fps-fix]
profile-cond=get("estimated-vf-fps", 0) > 47
profile-restore=copy
video-sync=audio

# 8K 像素量级轻量化
[8k-fix]
profile-cond=get("video-params/w", 0) * get("video-params/h", 0) >= 28000000
profile-restore=copy
hwdec=auto-safe
video-sync=audio

# 音视频同步保护（倍速等大范围变速时）
[video-sync]
profile-cond=(speed * audio_speed_correction) > 0 and ((speed * audio_speed_correction) < 0.96 or (speed * audio_speed_correction) > 1.04) and not (get("estimated-vf-fps") > 47 or get("display-fps") > 120)
profile-restore=copy-equal
video-sync=display-tempo

# 暂停时取消窗口置顶
[pause]
profile-cond=pause
profile-restore=copy
ontop=no

# 最小化时自动暂停
[minimized]
profile-cond=window_minimized and vid and not get("current-tracks/video/albumart")
profile-restore=copy-equal
pause

# 最大化时保持窗口大小不自动调整
[maximized]
profile-cond=window_maximized and vid and not get("current-tracks/video/albumart")
profile-restore=copy-equal
auto-window-resize=no

# ============================================================
# 手动配置组（菜单 配置组 或 Alt+数字 切换）
# ============================================================

# 性能模式：关掉重负载，适合低配/卡顿/直播
[性能]
profile-desc=性能模式（轻量，省电）
interpolation=no
deband=no
glsl-shaders=""
scale=bilinear
cscale=bilinear
dscale=bilinear

# 电影模式：默认高画质（与当前默认一致，明确命名方便切换）
[电影]
profile-desc=电影模式（高画质）
interpolation=yes
deband=yes
scale=ewa_lanczossharp
cscale=catmull_rom
dscale=catmull_rom

# 动画模式：Anime4K 增强 + 补帧（看动画推荐）
[动画]
profile-desc=动画模式（Anime4K + 补帧）
glsl-shaders-append="~~/shaders/Anime4K/Anime4K_Restore_CNN_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl"

# 高码率模式：放开 8K 上限 + 大缓存（看高码率/高规格源，需网络和显卡撑得住）
[高码率]
profile-desc=高码率（不锁 4K，大缓存）
glsl-shaders=""
ytdl-format=bestvideo[height<=?4320][vcodec!=?vp9.2]+bestaudio/best
cache=yes
demuxer-max-bytes=512MiB
demuxer-readahead-secs=30

# ============================================================
# Profiles
# ============================================================

# ----- B 站弹幕修复：自动禁用 danmaku XML 字幕轨（渲染会黑屏）-----
[bilibili-nodanmaku]
profile-cond=string.find(get("path", ""), "bilibili") ~= nil
profile-restore=copy
sid=no

# ----- B 站直播：强制 AVC（HEVC 线路丢包会花屏）+ 适度缓存 -----
[bilibili-live]
profile-cond=string.find(get("path", ""), "live.bilibili") ~= nil
profile-restore=copy
ytdl-format=best[height<=?1080][vcodec~=avc]/best[height<=?1080]
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=15
network-timeout=25

# ----- 虎牙直播：FLV 流需 Referer（防盗链）+ 直播缓存，与 B 站直播同理 -----
# 虎牙流只吃纯净请求头(实测带任何 Referer 都 403)；必须清空全局 B 站 Referer
# （mpv-huya.bat 用 yt-dlp 取 FLV，yt-dlp 自行处理签名/UA）
[huya-live]
profile-cond=string.find(get("path", ""), "huya.com") ~= nil
profile-restore=copy
http-header-fields=""
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=15
network-timeout=25

# ----- B 站点播：大会员画质（Firefox cookie 自动检测）-----
# 浏览器 cookie 读取对比（均实测）：
#   Edge   → 运行时锁库，yt-dlp 复制失败（issue 7271）
#   Chrome → App-Bound 新加密解不开（issue 10927）
#   Firefox → ✅ 无锁库/加密限制，浏览器开着也能读
# 用法：用 Firefox（G:\Firefox\core\firefox.exe）登录 bilibili.com（需大会员），
#       之后 mpv 播 B 站自动解锁 1080P 高码率/4K。未登录则匿名播放，不会报错。
# 备选：导出 cookies.txt 到本目录，把下面 cookies-from-browser 行换成
#       ytdl-raw-options-append=cookies=C:/Users/Administrator/AppData/Roaming/mpv/cookies.txt
[bilibili-vod]
profile-cond=string.find(get("path", ""), "bilibili") ~= nil and io.open("C:/Users/Administrator/AppData/Roaming/Mozilla/Firefox/Profiles/gmunjri5.default-release/cookies.sqlite", "r") ~= nil
profile-restore=copy
ytdl-raw-options-append=cookies-from-browser=firefox:gmunjri5.default-release

# ----- 抖音点播：Firefox cookie 解锁高清（抖音是境内站，mpv-douyin.bat 不走代理）-----
# 注意：全局 http-header-fields 带 B 站 Referer，抖音 CDN 不需要也不介意，但为干净起见清空
[douyin]
profile-cond=string.find(get("path", ""), "douyin") ~= nil and io.open("C:/Users/Administrator/AppData/Roaming/Mozilla/Firefox/Profiles/gmunjri5.default-release/cookies.sqlite", "r") ~= nil
profile-restore=copy
http-header-fields=""
ytdl-raw-options-append=cookies-from-browser=firefox:gmunjri5.default-release


# ----- 超高清自动轻量化（≥2160p 关插帧/去色带防卡）-----
[超高清]
profile-desc=4K/8K：GPU tscale 轻量插帧 + 降负载（VapourSynth 4K 扛不住，tscale 零开销）
profile-cond=(get("video-params/h", 0) >= 2160 or get("height", 0) >= 2160)
profile-restore=copy
# --- 插帧：用 mpv 内置 GPU tscale（不占 CPU，GPU 渲染管线内完成）---
interpolation=yes
video-sync=display-resample
tscale=sphinx
# --- 降其他 GPU 负载，给 tscale 腾出余量 ---
deband=no
dither-depth=auto
correct-downscaling=no
linear-downscaling=yes
dscale=mitchell
cscale=bilinear
scale=catmull_rom
hdr-compute-peak=no
target-colorspace-hint=no
icc-force-contrast=no
# 不加载 VapourSynth 插帧（4K 时 CPU 扛不住）
vf-clr

# ----- Anime4K 动画增强（默认关闭，防真人视频涂抹）-----
# 看动画时手动开：mpv --profile=Anime4K "视频"（Ctrl+2 运行时切换）
[Anime4K]
profile-desc=动画增强（CNN 修复 + 高光保护）
glsl-shaders-append="~~/shaders/Anime4K/Anime4K_Restore_CNN_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl"
# ----- 大测试补全（源自 emoeem/mpv 精华）-----
[pgs-fix]
profile-desc=修复内封 PGS 字幕画幅错位
profile-cond=get("video-params/aspect", 0) > 16 / 9 and get("current-tracks/sub/codec", ""):lower():find("pgs", 1, true) ~= nil
profile-restore=copy
stretch-image-subs-to-screen=yes

[peak-percentile]
profile-desc=暗场 HDR 峰值自适应
profile-cond=get("video-params/avg-pq-y", 1) < 0.21
profile-restore=copy
hdr-peak-percentile=99.8

[SDR-gamut]
profile-desc=SDR 非标准色域裁剪映射
profile-cond=get("video-params/primaries") ~= "bt.709" and get("video-params/gamma") == "bt.1886"
profile-restore=copy
gamut-mapping-mode=clip

[SDR-target]
profile-desc=SDR 目标输出校正
profile-cond=not get("video-params/max-luma") and not get("inverse-tone-mapping")
profile-restore=copy
target-colorspace-hint=no

[默认]
profile-desc=恢复默认画质设置
hwdec=auto-safe
interpolation=yes
deband=yes
scale=ewa_lanczossharp
cscale=catmull_rom
dscale=catmull_rom
glsl-shaders=""
ytdl-format=bestvideo[vcodec~=av01][height<=?2160][vcodec!=?vp9.2]+bestaudio/bestvideo[vcodec!=?vp9.2][vcodec!=?vp9][height<=?2160]+bestaudio/best

# ----- 长视频平台（爱奇艺/优酷/腾讯/芒果）：清B站Referer防CDN干扰 + 缓存 -----
[iqiyi]
profile-cond=string.find(get("path", ""), "iqiyi%.com") ~= nil
profile-restore=copy
http-header-fields=""
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=15
ytdl-raw-options-append=cookies-from-browser=firefox:gmunjri5.default-release   # 登录后免费内容可播范围/画质更佳

[youku]
profile-cond=string.find(get("path", ""), "youku%.com") ~= nil
profile-restore=copy
http-header-fields=""
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=15
ytdl-raw-options-append=cookies-from-browser=firefox:gmunjri5.default-release   # 登录后免费内容可播范围/画质更佳

[tencent-video]
profile-cond=string.find(get("path", ""), "v%.qq%.com") ~= nil
profile-restore=copy
http-header-fields=""
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=15
ytdl-raw-options-append=cookies-from-browser=firefox:gmunjri5.default-release   # 登录后免费内容可播范围/画质更佳

[mgtv]
profile-cond=string.find(get("path", ""), "mgtv%.com") ~= nil
profile-restore=copy
http-header-fields=""
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=15
ytdl-raw-options-append=cookies-from-browser=firefox:gmunjri5.default-release   # 登录后免费内容可播范围/画质更佳

# ============================================================
# 画质全链路模式（右键菜单 > 画质模式 一键切换）
# 每个模式自动替换全部着色器链路，互不冲突
# ============================================================

[真人最优]
profile-desc=真人最优：CfL_Prediction色度升采样 + ArtCNN神经网络放大 + SSimSuperRes自适应锐化
glsl-shaders="~~/shaders/igv/CfL_Prediction.glsl,~~/shaders/igv/ArtCNN_C4F16.glsl,~~/shaders/igv/SSimSuperRes.glsl"
scale=ewa_lanczossharp
dscale=catmull_rom

[动画最优]
profile-desc=动画最优：Anime4K CNN VL 全链路（Restore + Upscale + Clamp）
glsl-shaders="~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl,~~/shaders/Anime4K/Anime4K_Restore_CNN_VL.glsl,~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_VL.glsl,~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl,~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x4.glsl,~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_M.glsl,~~/shaders/igv/CfL_Prediction.glsl"
scale=ewa_lanczossharp

[直播优化]
profile-desc=直播优化：CfL色度 + 锐化 + 去色带 + RTX VSR 超分（低码率直播最佳）
glsl-shaders="~~/shaders/igv/CfL_Prediction.glsl,~~/shaders/igv/adaptive-sharpen.glsl"
deband=yes
deband-iterations=2
deband-threshold=64
deband-range=20
deband-grain=24
# RTX Video Super Resolution：NVIDIA 低码率超分（需 hwdec=d3d11va 非 copy 模式）
hwdec=d3d11va
gpu-api=d3d11
vf-add=d3d11vpp=scale=2:scaling-mode=nvidia
# RTX VSR 联动检测由 scripts/rtx-vsr-guard.lua 自动处理

[4K降采样]
profile-desc=4K降采样：SSimDownscaler + CfL_Prediction（4K→2K最佳方案）
glsl-shaders="~~/shaders/igv/SSimDownscaler.glsl,~~/shaders/igv/CfL_Prediction.glsl"
scale=ewa_lanczossharp
dscale=catmull_rom

[电影全链路]
profile-desc=电影全链路：CfL_Prediction + ArtCNN + SSimSuperRes + 自适应锐化 + SSimDownscaler
glsl-shaders="~~/shaders/igv/CfL_Prediction.glsl,~~/shaders/igv/ArtCNN_C4F16.glsl,~~/shaders/igv/SSimSuperRes.glsl,~~/shaders/igv/adaptive-sharpen.glsl,~~/shaders/igv/SSimDownscaler.glsl"
scale=ewa_lanczossharp

[画质默认]
profile-desc=画质默认：清除全部着色器，回到 mpv 内置画质
glsl-shaders=""
scale=ewa_lanczossharp
cscale=catmull_rom
dscale=catmull_rom
deband=yes
deband-iterations=1

# ============================================================
# 帧率档位（按需切换：60/120/144fps + 插帧引擎）
# ============================================================
[帧率-60fps]
profile-desc=帧率: 60fps（mvtools 轻量插帧，省电/低配置）
change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_60.vpy"
interpolation=yes
video-sync=display-resample
tscale=oversample

[帧率-120fps]
profile-desc=帧率: 120fps（mvtools 标准插帧，平衡）
change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_120.vpy"
interpolation=yes
video-sync=display-resample
tscale=oversample

[帧率-144fps]
profile-desc=帧率: 144fps（mvtools 高帧插帧，游戏/运动）
change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_144.vpy"
interpolation=yes
video-sync=display-resample
tscale=oversample

[帧率-Auto]
profile-desc=帧率: 自动 280Hz（sphinx 插帧，默认最优）
interpolation=yes
video-sync=display-resample
tscale=sphinx
glsl-shaders="~~/shaders/igv/CfL_Prediction.glsl,~~/shaders/igv/SSimSuperRes.glsl"

[帧率-关闭]
profile-desc=帧率: 关闭插帧（源帧率直出，省电/漫画）
interpolation=no
video-sync=audio
deband=no
