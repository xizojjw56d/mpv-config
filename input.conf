# ============================================================
# input.conf — 快捷键 + 右键菜单（#menu: 标签定义菜单结构）
# 借鉴 emoeem/mpv 配置包的菜单设计，适配本机资源
# 右键点击画面 = 打开菜单
# ============================================================

# ================= 文件 =================
SHIFT+F11 stop                                     #menu: 文件 > 停止
ALT+t cycle ontop;show-text "置顶:${ontop}"        #menu: 文件 > 开/关 置顶        #@state=(ontop and 'checked')
ALT+b cycle window-maximized                       #menu: 文件 > 开/关 最大化      #@state=(window_maximized and 'checked')
ENTER cycle fullscreen                             #menu: 文件 > 开/关 全屏        #@state=(fullscreen and 'checked')
i script-binding stats/display-stats               #menu: 文件 > 临时统计信息
I script-binding stats/display-stats-toggle        #menu: 文件 > 常驻统计信息
L cycle-values loop-file inf no;show-text "循环:${loop-file}"   #menu: 文件 > 开/关 循环播放  #@state=(loop_file and 'checked')
l ab-loop                                          #menu: 文件 > 设定/清除 片段循环
# [ / ] 键由 speed_control.lua 接管（0.1x~3x 步进 ±0.1，OSD 显示速度）
CTRL+[ script-message speed_down;show-text "速度-0.1"  #menu: 文件 > 速度 > 速度 -0.1（0.1~3x）
CTRL+] script-message speed_up;show-text "速度+0.1"  #menu: 文件 > 速度 > 速度 +0.1（0.1~3x）
{ no-osd multiply speed 0.5;show-text "速度:${speed}"   #menu: 文件 > 速度 > 半速
} no-osd multiply speed 2.0;show-text "速度:${speed}"   #menu: 文件 > 速度 > 2倍速
ALT+1 no-osd set speed 1.0;show-text "速度:1x"  #menu: 文件 > 速度 > 1倍速（正常）
ALT+2 no-osd set speed 2.0;show-text "速度:2x"  #menu: 文件 > 速度 > 2倍速
ALT+3 no-osd set speed 3.0;show-text "速度:3x"  #menu: 文件 > 速度 > 3倍速
ALT+4 no-osd set speed 0.5;show-text "速度:0.5x"  #menu: 文件 > 速度 > 半速
BS no-osd set speed 1.0;show-text "速度:${speed}"  #menu: 文件 > 速度 > 重置速度

# ================= 画面 =================
A cycle-values video-aspect-override 16:9 4:3 2.35:1 -1;show-text "宽高比:${video-aspect-override}"   #menu: 画面 > 切换 宽高比
CTRL+LEFT cycle-values video-rotate 0 270 180 90;show-text "旋转:${video-rotate}"   #menu: 画面 > 左旋转
CTRL+RIGHT cycle-values video-rotate 0 90 180 270;show-text "旋转:${video-rotate}"  #menu: 画面 > 右旋转
CTRL+- add window-scale -0.1;show-text "窗口缩小:${window-scale}"   #menu: 画面 > 画面缩放 > 缩小窗口
CTRL+= add window-scale  0.1;show-text "窗口放大:${window-scale}"   #menu: 画面 > 画面缩放 > 放大窗口
ALT+- add video-zoom -0.1;show-text "画面缩小:${video-zoom}"   #menu: 画面 > 画面缩放 > 画面缩小
ALT+= add video-zoom  0.1;show-text "画面放大:${video-zoom}"   #menu: 画面 > 画面缩放 > 画面放大
ALT+LEFT add video-pan-x -0.1;show-text "左移:${video-pan-x}"  #menu: 画面 > 画面缩放 > 画面左移
ALT+RIGHT add video-pan-x 0.1;show-text "右移:${video-pan-x}"  #menu: 画面 > 画面缩放 > 画面右移
ALT+UP add video-pan-y -0.1;show-text "上移:${video-pan-y}"    #menu: 画面 > 画面缩放 > 画面上移
ALT+DOWN add video-pan-y 0.1;show-text "下移:${video-pan-y}"   #menu: 画面 > 画面缩放 > 画面下移
ALT+p cycle-values panscan 0.0 1.0;show-text "裁切填充:${panscan}"  #menu: 画面 > 开/关 裁切填充  #@state=(panscan and 'checked')
ALT+BS set video-zoom 0;set panscan 0;set video-rotate 0;set video-pan-x 0;set video-pan-y 0;set video-aspect-override -1;show-text "重置画面"  #menu: 画面 > 重置画面操作
CTRL+I cycle icc-profile-auto;show-text "ICC 校色:${icc-profile-auto}"  #menu: 画面 > 开/关 自动 ICC 校色  #@state=(icc_profile_auto and 'checked')
1 add contrast -1;show-text "对比度:${contrast}"    #menu: 画面 > 调色 > 对比度 -1
2 add contrast  1;show-text "对比度:${contrast}"    #menu: 画面 > 调色 > 对比度 +1
3 add brightness -1;show-text "明度:${brightness}"  #menu: 画面 > 调色 > 明度 -1
4 add brightness  1;show-text "明度:${brightness}"  #menu: 画面 > 调色 > 明度 +1
5 add gamma -1;show-text "伽马:${gamma}"            #menu: 画面 > 调色 > 伽马 -1
6 add gamma  1;show-text "伽马:${gamma}"            #menu: 画面 > 调色 > 伽马 +1
7 add saturation -1;show-text "饱和度:${saturation}" #menu: 画面 > 调色 > 饱和度 -1
8 add saturation  1;show-text "饱和度:${saturation}" #menu: 画面 > 调色 > 饱和度 +1
- add hue -1;show-text "色相:${hue}"                #menu: 画面 > 调色 > 色相 -1
= add hue  1;show-text "色相:${hue}"                #menu: 画面 > 调色 > 色相 +1
CTRL+BS set contrast 0;set brightness 0;set gamma 0;set saturation 0;set hue 0;show-text "重置调色"  #menu: 画面 > 调色 > 重置调色
D cycle deband;show-text "去色带:${deband}"         #menu: 画面 > 去色带 > deband 开关  #@state=(deband and 'checked')
ALT+z add deband-iterations 1;show-text "去色带强度:${deband-iterations}"  #menu: 画面 > 去色带 > 强度 +1
ALT+x add deband-iterations -1;show-text "去色带强度:${deband-iterations}" #menu: 画面 > 去色带 > 强度 -1

# ================= HDR（外接显示器）=================
h cycle-values tone-mapping auto spline bt.2390 hable bt.2446a st2094-40 st2094-10;show-text "HDR映射:${tone-mapping}"  #menu: HDR > 切换 映射曲线
ALT+h cycle-values hdr-compute-peak yes no;show-text "HDR动态映射:${hdr-compute-peak}"  #menu: HDR > 切换 动态映射  #@state=(hdr_compute_peak and 'checked')
CTRL+h cycle target-colorspace-hint;show-text "HDR直通:${target-colorspace-hint}"  #menu: HDR > 切换 直通模式  #@state=(target_colorspace_hint and 'checked')
CTRL+t cycle-values target-trc auto pq gamma2.2;show-text "显示器TRC:${target-trc}"  #menu: HDR > 切换 显示器TRC
CTRL+T cycle-values target-peak 100 203;show-text "映射峰值:${target-peak}"  #menu: HDR > 切换 映射目标峰值
CTRL+SHIFT+g cycle gamut-mapping-mode;show-text "色域映射:${gamut-mapping-mode}"  #menu: HDR > 切换 色域映射模式

# ================= 轨道（动态列表）=================
#menu: 轨道 #@tracks
#menu: 轨道 > 章节列表 #@chapters

# ================= 视频 =================
ALT+i cycle interpolation;show-text "内置补帧(tscale=${tscale}):${interpolation}"  #menu: 视频 > 开/关 内置补帧(tscale=sphinx·280Hz插帧)  #@state=(interpolation and 'checked')
CTRL+SHIFT+i show-text "插帧:${interpolation}  算法:tscale=${tscale}  显示器刷新率:${display-fps}Hz"  #menu: 视频 > 查看插帧状态(tscale·帧率·开/关)
# 帧率档位（ALT+F1~F5 切换，或右键菜单 → 帧率档位）
ALT+F1 change-list vf remove "@interp"; change-list vf add "@interp:vapoursynth=file=~~/interp_60.vpy"; show-text "帧率:60fps(mvtools轻量)"  #menu: 帧率档位 > 60fps（mvtools 轻量插帧）
ALT+F2 change-list vf remove "@interp"; change-list vf add "@interp:vapoursynth=file=~~/interp_120.vpy"; show-text "帧率:120fps(mvtools标准)"  #menu: 帧率档位 > 120fps（mvtools 标准插帧）
ALT+F3 change-list vf remove "@interp"; change-list vf add "@interp:vapoursynth=file=~~/interp_144.vpy"; show-text "帧率:144fps(mvtools高帧)"  #menu: 帧率档位 > 144fps（mvtools 高帧插帧）
ALT+F4 apply-profile 帧率-Auto;show-text "帧率:Auto 280Hz(sphinx默认)"  #menu: 帧率档位 > Auto 280Hz（sphinx 默认最优）
ALT+F5 apply-profile 帧率-关闭;show-text "帧率:关闭(源帧率直出)"  #menu: 帧率档位 > 关闭插帧（源帧率直出）
d cycle deinterlace;show-text "去交错:${deinterlace}"  #menu: 视频 > 开/关 去交错  #@state=(deinterlace and 'checked')
s screenshot subtitles          #menu: 视频 > 截屏 > 带字幕截图
S screenshot video              #menu: 视频 > 截屏 > 无字幕截图
CTRL+s screenshot window        #menu: 视频 > 截屏 > 实际尺寸截图(含OSD)
ALT+s screenshot subtitles+each-frame   #menu: 视频 > 截屏 > 带字幕逐帧
ALT+S screenshot video+each-frame       #menu: 视频 > 截屏 > 无字幕逐帧
, frame-back-step;show-text "帧:${estimated-frame-number}"  #menu: 视频 > 逐帧 > 上一帧
. frame-step;show-text "帧:${estimated-frame-number}"       #menu: 视频 > 逐帧 > 下一帧

# ================= 补帧（本机核心功能）=================
F12 change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_60.vpy"; show-text "补帧: 60fps 轻量"   #menu: 补帧 > 60fps（mvtools 轻量）
CTRL+e change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_120.vpy"; show-text "补帧: 120fps 标准"  #menu: 补帧 > 120fps（mvtools 标准）
CTRL+u change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_144.vpy"; show-text "补帧: 144fps 高帧"  #menu: 补帧 > 144fps（mvtools 高帧）
CTRL+a change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_high.vpy"; show-text "补帧: 120fps 高质量"  #menu: 补帧 > 120fps（mvtools 高质量）
CTRL+r change-list vf clr ""; change-list vf add "vapoursynth=file=~~/interp_rife.vpy"; show-text "补帧: RIFE AI 120fps"  #menu: 补帧 > 120fps（RIFE AI，GPU）
# Ctrl+q 已让位给 quality-menu 脚本（在线画质菜单）
CTRL+SHIFT+Q change-list vf clr ""; show-text "补帧: 关闭"  #menu: 补帧 > 关闭补帧（Ctrl+Shift+Q）

# ================= 导航 =================
O no-osd cycle-values osd-level 3 1;show-text "OSD时间轴:${osd-level}"  #menu: 导航 > 开/关 OSD 时间轴
F4 script-binding uosc/menu    #menu: 导航 > 综合菜单（美化）
F5 script-binding select/select-edition;show-text ''  #menu: 导航 > 版本列表
F7 script-binding select/select-chapter;show-text ''   #menu: 导航 > 章节列表
F8 script-binding select/select-track;show-text ''     #menu: 导航 > 轨道列表
F9 script-binding select/select-vid;show-text ''       #menu: 导航 > 视频轨列表
F10 script-binding select/select-aid;show-text ''      #menu: 导航 > 音频轨列表
F11 script-binding select/select-sid;show-text ''      #menu: 导航 > 字幕轨列表
SHIFT+RIGHT seek 1 exact;show-text "精准+1s"   #menu: 导航 > 精确跳转 > 前进 1 秒
SHIFT+LEFT seek -1 exact;show-text "精准-1s"   #menu: 导航 > 精确跳转 > 后退 1 秒
SHIFT+UP seek 80 exact;show-text "精准+80s"    #menu: 导航 > 精确跳转 > 前进 80 秒
SHIFT+DOWN seek -80 exact;show-text "精准-80s" #menu: 导航 > 精确跳转 > 后退 80 秒
#menu: 导航 > ---
F3 script-message-to chapterskip skip-to-silence;show-text "跳到下一个静音位置"  #menu: 导航 > 跳到下一个静音位置
CTRL+ALT+b script-message skip-segments toggle-auto               #menu: 工具 > 跳过片段 > 开/关 自动跳过
F6 script-message series_select                                     #menu: 导航 > 选集菜单（电视剧/番剧/系列）
#menu: 导航 > 章节制作 > 标记章节时间
#menu: 导航 > 章节制作 > 编辑章节标题
#menu: 导航 > 章节制作 > 删除当前章节
# 章节制作快捷键：ALT+c 标记, ALT+e 编辑, ALT+r 删除（由 chapter_make_read 脚本注册）

# ================= 音频 =================
y script-binding uosc/audio                   #menu: 音频 > 切换 音轨（音轨列表）
m cycle mute;show-text "静音:${mute}"          #menu: 音频 > 切换 静音  #@state=(mute and 'checked')
CTRL+, add audio-delay -0.1;show-text "延迟:${audio-delay}"  #menu: 音频 > 延迟 -0.1
CTRL+. add audio-delay  0.1;show-text "延迟:${audio-delay}"  #menu: 音频 > 延迟 +0.1
; set audio-delay 0;show-text "重置延迟"        #menu: 音频 > 重置延迟
ALT+y cycle-values audio-channels "7.1,5.1,stereo" "7.1" "5.1" "stereo" "auto-safe" "auto";show-text "声道:${audio-channels}"  #menu: 音频 > 切换 声道输出
ALT+Y cycle audio-exclusive;show-text "音频独占:${audio-exclusive}"  #menu: 音频 > 切换 音频独占  #@state=(audio_exclusive and 'checked')
ALT+U cycle hr-seek-framedrop;show-text "音频同步:${hr-seek-framedrop}"  #menu: 音频 > 切换 音频同步模式  #@state=(hr_seek_framedrop and 'checked')
F2 cycle-values af "@dynaudnorm:lavfi=[dynaudnorm=f=500:g=31:p=0.5:m=5:r=0.9]" "@loudnorm:lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]" "";show-text "下混滤镜"  #menu: 音频 > 切换 下混滤镜（响度均衡）
ALT+` af clr "";show-text "音频滤镜已清空"  #menu: 音频 > 清空音频滤镜
UP no-osd add volume 5;show-text "音量:${volume}"    #menu: 音频 > 音量 > +5
DOWN no-osd add volume -5;show-text "音量:${volume}"  #menu: 音频 > 音量 > -5

# ================= 字幕 =================
j cycle sub;show-text "字幕轨:${sub}"          #menu: 字幕 > 切换 字幕轨
k cycle secondary-sid;show-text "次字幕:${secondary-sid}"  #menu: 字幕 > 切换 次字幕
v cycle sub-visibility;show-text "字幕可见:${sub-visibility}"  #menu: 字幕 > 切换 字幕可见性  #@state=(sub_visibility and 'checked')
u cycle sub-ass-override;show-text "渲染样式:${sub-ass-override}"  #menu: 字幕 > 切换 渲染样式
# AI 字幕（脚本已注册 Alt+f/Ctrl+f=中文, Alt+g/Ctrl+g=英文）
#                script-message-to sub-fastwhisper sub-fastwhisper  #menu: 字幕 > AI 字幕 > 生成中文（Alt+F / Ctrl+F）
#                script-message-to sub-fastwhisper sub-fastwhisper-en  #menu: 字幕 > AI 字幕 > 生成英文（Alt+G / Ctrl+G）
r add sub-pos -1;show-text "字幕上移:${sub-pos}"  #menu: 字幕 > 其他 > 字幕上移
t add sub-pos 1;show-text "字幕下移:${sub-pos}"   #menu: 字幕 > 其他 > 字幕下移
z add sub-delay -0.1;show-text "延迟:${sub-delay}"  #menu: 字幕 > 其他 > 延迟 -0.1
x add sub-delay  0.1;show-text "延迟:${sub-delay}"  #menu: 字幕 > 其他 > 延迟 +0.1
ALT+j add sub-scale -0.1;show-text "字号:${sub-scale}"  #menu: 字幕 > 其他 > 字号 -0.1
ALT+k add sub-scale  0.1;show-text "字号:${sub-scale}"  #menu: 字幕 > 其他 > 字号 +0.1
CTRL+j sub-seek -1   #menu: 字幕 > 其他 > 跳上一条字幕
CTRL+k sub-seek  1   #menu: 字幕 > 其他 > 跳下一条字幕
CTRL+SHIFT+r sub-reload;show-text "重载字幕"   #menu: 字幕 > 重载当前字幕
# ALT+f / ALT+g 已由 sub-fastwhisper 脚本内部注册，此处不重复
SHIFT+BS set sub-pos 100;set sub-scale 1.0;set sub-delay 0;show-text "重置字幕"  #menu: 字幕 > 其他 > 恢复初始
#menu: ---
# ----- 新增字幕工具（来自 emoeem/mpv）-----
CTRL+SHIFT+f script-message-to sub_assrt sub-assrt                #menu: 字幕 > 下载字幕（assrt.net）
CTRL+M script-message-to uosc_subtitle_lines open                #menu: 字幕 > 字幕内容菜单
ALT+m script-message-to sub_export export-selected-subtitles      #menu: 字幕 > 导出内封字幕
Y script-message sub-select toggle                                #menu: 字幕 > 切换 智能字幕选择
CTRL+ALT+m script-message-to autosubsync autosubsync-menu         #menu: 字幕 > 字幕同步

# ================= 着色器（右键菜单快速切换，带开/关反馈）=================
CTRL+0 change-list glsl-shaders clr "";show-text "着色器已清空"  #menu: 着色器 > 清空全部
CTRL+1 script-message shader_toggle cas;show-text "CAS锐化"  #menu: 着色器 > CAS 锐化
CTRL+2 script-message shader_toggle anime4k;show-text "Anime4K"  #menu: 着色器 > Anime4K（动画）
CTRL+3 script-message shader_toggle fsrcnnx;show-text "FSRCNNX"  #menu: 着色器 > FSRCNNX（放大）
CTRL+4 script-message shader_toggle ssim;show-text "SSimSuperRes"  #menu: 着色器 > SSimSuperRes（超分）

# ================= 视频滤镜 =================
CTRL+` vf clr "";show-text "滤镜已清空"  #menu: 视频滤镜 > 清空全部
! vf toggle vflip  #menu: 视频滤镜 > 开/关 垂直翻转
@ vf toggle hflip  #menu: 视频滤镜 > 开/关 水平翻转
$ vf toggle rotate=angle=180*PI/180  #menu: 视频滤镜 > 开/关 旋转 180°
% vf toggle format:gamma=gamma2.2  #menu: 视频滤镜 > 开/关 伽马修正 2.2
^ vf toggle fps=fps=60/1.001  #menu: 视频滤镜 > 开/关 强制帧率 59.94
* vf toggle pad=aspect=16/9:x=-1:y=-1  #menu: 视频滤镜 > 开/关 16:9 黑边填充
& vf toggle colortemperature=temperature=6500  #menu: 视频滤镜 > 开/关 色温修正 6500
#menu: ---

# ================= 配置组快速切换 =================
# 动画配置组保留 ALT+7 入口；CTRL+P 让位给命令面板（避免 Ctrl+P/Ctrl+p 大小写歧义）
ALT+5 apply-profile 性能;show-text "配置组:性能（轻量）"  #menu: 配置组 > 性能（轻量省电）
ALT+6 apply-profile 电影;show-text "配置组:电影（高画质）"  #menu: 配置组 > 电影（高画质）
ALT+7 apply-profile 动画;show-text "配置组:动画（Anime4K+补帧）"  #menu: 配置组 > 动画（Anime4K+补帧）
ALT+8 apply-profile Anime4K;show-text "配置组:Anime4K（动画增强）"  #menu: 配置组 > Anime4K（动画增强）
ALT+9 apply-profile 默认;show-text "配置组:默认（恢复）"  #menu: 配置组 > 默认
ALT+0 apply-profile 高码率;show-text "配置组:高码率（不锁4K+大缓存）"  #menu: 配置组 > 高码率（不锁4K，大缓存） ⚡


# ================= 章节制作（chapter_make_read）=================
ALT+c script-message-to chapter_make_read create_chapter   #menu: 导航 > 章节制作 > 标记章节时间
ALT+e script-message-to chapter_make_read edit_chapter     #menu: 导航 > 章节制作 > 编辑章节标题
ALT+r script-message-to chapter_make_read remove_chapter   #menu: 导航 > 章节制作 > 删除当前章节

# ================= 其他补全 =================
CTRL+o script-message-to open_dialog import_files          #menu: 打开 > 原生文件对话框
CTRL+ALT+p script-message-to pip toggle-pip                #menu: 工具 > 画中画

# ================= 工具 =================
~ script-binding console/enable  #menu: 工具 > 打开控制台
CTRL+d script-message-to uosc_danmaku show_danmaku_keyboard  #menu: 工具 > 弹幕功能 > 开/关 弹幕显示
CTRL+D script-message-to uosc_danmaku open_add_total_menu    #menu: 工具 > 弹幕功能 > 弹幕综合菜单
CTRL+B cycle title-bar;show-text "标题栏:${title-bar}"  #menu: 工具 > 切换 标题栏  #@state=(title_bar and 'checked')
CTRL+ALT+t set clipboard/text ${time-pos};show-text "已复制当前时间"  #menu: 工具 > 复制当前时间
CTRL+ALT+s set clipboard/text ${sub-text};show-text "已复制当前字幕"  #menu: 工具 > 复制当前字幕内容
CTRL+ALT+SHIFT+t script-binding seek-show-position/copy-time      #menu: 工具 > 复制 > 复制时间戳
CTRL+ALT+SHIFT+s script-message-to screenshot-to-clipboard screenshot-to-clipboard  #menu: 工具 > 截图 > 截图到剪贴板
CTRL+ALT+i script-message-to playback-info toggle-info            #menu: 工具 > 信息显示 > 开/关 播放信息
Ctrl+p script-message-to command_palette show-command-palette "Command Palette"  #menu: 工具 > 打开命令面板
M nonrepeatable script-message manager-update-all                 #menu: 工具 > 检查并更新脚本和着色器
#                script-binding memo/memo-history                 #menu: 工具 > 备忘录
DEL script-message-to delete_current_file delete-file 1 "请按 1 确认删除"  #menu: 文件 > 删除当前文件
ALT+n script-message playlistmanager shuffle                      #menu: 文件 > 随机播放
#menu: ---
# 打开 / 历史 / 书签 / 最近播放
#menu: 打开 > 历史 #@history
#menu: 打开 > 书签 #@bookmarks
#menu: 打开 > 近期播放 #@recent
b cycle window-minimized  #menu: 最小化
q quit                    #menu: 退出程序
Q quit-watch-later

# ================= 历史 / 书签 / 最近播放 =================
` script-message-to simplehistory open-list;show-text ''          #menu: 打开 > 历史 > 历史菜单
CTRL+l script-message-to simplehistory history-load-last          #menu: 打开 > 历史 > 加载最后播放
CTRL+L script-message-to simplehistory history-resume             #menu: 打开 > 历史 > 恢复最后进度
N script-message-to simplebookmark open-list;show-text ''         #menu: 打开 > 书签 > 书签菜单
CTRL+n script-message-to simplebookmark bookmark-save             #menu: 打开 > 书签 > 添加进度书签
CTRL+N script-message-to simplebookmark bookmark-fileonly         #menu: 打开 > 书签 > 添加文件书签
CTRL+ALT+h script-binding recentmenu/open                         #menu: 打开 > 近期播放

# ================= 基本播放键（无菜单）=================
SPACE cycle pause
ESC set fullscreen no;set window-maximized no
# 右键打开 uosc 中文菜单（uosc 的 section 未自动启用，显式绑定）
MBTN_RIGHT script-binding uosc/menu-blurred
# 左键暂停 / 双击全屏（input-default-bindings=no 后需显式绑定）
MBTN_LEFT cycle pause;script-message-to uosc flash-pause-indicator
MBTN_LEFT_DBL cycle fullscreen

# ================= 解码方式切换 =================
CTRL+SHIFT+H cycle-values hwdec auto-safe d3d11va-copy nvdec-copy vulkan-copy vulkan no;show-text "硬解:${hwdec}"  #menu: 解码 > 硬解模式（循环切换）
# 硬解模式（可直接点选）
#                set hwdec auto-safe;show-text "硬解:auto-safe"  #menu: 解码 > 硬解模式 > auto-safe（自动·安全）
#                set hwdec d3d11va-copy;show-text "硬解:d3d11va-copy"  #menu: 解码 > 硬解模式 > d3d11va-copy（D3D11）
#                set hwdec nvdec-copy;show-text "硬解:nvdec-copy"  #menu: 解码 > 硬解模式 > nvdec-copy（N卡 NVDEC）
#                set hwdec vulkan-copy;show-text "硬解:vulkan-copy"  #menu: 解码 > 硬解模式 > vulkan-copy（Vulkan）
#                set hwdec vulkan;show-text "硬解:vulkan"  #menu: 解码 > 硬解模式 > vulkan（Vulkan 直通·备用）
#                set hwdec no;show-text "硬解:关闭（软解）"  #menu: 解码 > 硬解模式 > no（软解）
# GPU 渲染 API 切换（需重启 mpv 生效，uosc 菜单项）
#                set gpu-api d3d11;show-text "GPU渲染:D3D11（重启生效）"  #menu: 解码 > GPU 渲染 API > D3D11（当前）
#                set gpu-api vulkan;show-text "GPU渲染:Vulkan（重启生效）"  #menu: 解码 > GPU 渲染 API > Vulkan
# 使用方法：先选好 GPU API，再配合上面的硬解模式切换
# D3D11 + auto-safe / d3d11va-copy  —— 微软方案，兼容性好
# Vulkan + nvdec-copy / vulkan-copy / auto-copy-safe  —— 性能略优，N卡推荐
# vulkan（直通）需 GPU API 也切换为 Vulkan 并重启才生效；vulkan-copy 任何 API 下都可用
RIGHT seek 60
LEFT seek -30
PGUP add chapter 1
PGDWN add chapter -1
MBTN_FORWARD playlist-next
MBTN_BACK playlist-prev
Wheel_Up no-osd add volume 10;script-message-to uosc flash-volume
Wheel_Down no-osd add volume -10;script-message-to uosc flash-volume

# ================= 编码切换（B 站）=================
CTRL+F1 script-message codec_switch av1;show-text "编码:AV1"  #menu: 编码 > AV1
CTRL+F2 script-message codec_switch avc;show-text "编码:AVC"  #menu: 编码 > AVC(H.264，直播最稳)
CTRL+F3 script-message codec_switch hevc;show-text "编码:HEVC"  #menu: 编码 > HEVC
CTRL+F4 script-message codec_switch default;show-text "编码:默认"  #menu: 编码 > 默认
F1 cycle vid; show-text "视频轨: ${vid}"

# ================= 画质切换（在线视频）=================
CTRL+F5 script-message quality_switch q4k;show-text "画质:4K"  #menu: 画质 > 4K (2160P)
CTRL+F6 script-message quality_switch q2k;show-text "画质:2K"  #menu: 画质 > 2K (1440P)
CTRL+F7 script-message quality_switch q1080;show-text "画质:1080P"  #menu: 画质 > 1080P
CTRL+F8 script-message quality_switch q720;show-text "画质:720P"  #menu: 画质 > 720P
CTRL+F9 script-message quality_switch qauto;show-text "画质:自动最高"  #menu: 画质 > 自动最高
CTRL+F10 script-message quality_switch q8k;show-text "画质:8K"  #menu: 画质 > 8K (4320P)
# ================= DLSSNR（NVIDIA NGX 画质增强）=================
CTRL+ALT+n script-message dlssnr-toggle;show-text "DLSSNR增强"  #menu: 工具 > DLSSNR画质增强
# 需要: vs-plugins/vs_dlssnr.dll + vs-plugins/ngx/nvngx_dlssnr.dll（需自行构建或下载）
# 构建方法: https://github.com/Rygtx/mpv_PlayKit (dlssnr 分支) native/scripts/build.ps1

# ================= 画质模式（一键全链路切换）=================
CTRL+ALT+F7 apply-profile 真人最优;show-text "画质: 真人最优（CfL+ArtCNN+SSimSR）"  #menu: 画质模式 > 真人最优（CfL+ArtCNN+SSimSR）
CTRL+ALT+F8 apply-profile 动画最优;show-text "画质: 动画最优（Anime4K VL+CfL）"  #menu: 画质模式 > 动画最优（Anime4K VL+CfL）
CTRL+ALT+F9 apply-profile 直播优化;show-text "画质: 直播优化（CfL+锐化+RTX VSR）"  #menu: 画质模式 > 直播优化（CfL+锐化+RTX VSR）
CTRL+ALT+F10 apply-profile 4K降采样;show-text "画质: 4K降采样（SSimDS+CfL）"  #menu: 画质模式 > 4K降采样（SSimDS+CfL）
CTRL+ALT+F11 apply-profile 电影全链路;show-text "画质: 电影全链路（CfL+ArtCNN+SSim+锐化+DS）"  #menu: 画质模式 > 电影全链路（CfL+ArtCNN+SSim+锐化+DS）
CTRL+ALT+F12 apply-profile 画质默认;show-text "画质: 默认（清除全部着色器）"  #menu: 画质模式 > 默认（清除全部着色器）
